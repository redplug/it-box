about:
  content: |
    # it-box 소개

    it-box는 개발과 데이터 작업에 필요한 온라인 도구를 한국어로 제공하는 사이트입니다. 운영자는 박지환이며 개인이 운영합니다. 가능한 경우 입력한 데이터는 브라우저 안에서 처리되며, 민감한 비밀번호·API 키·개인정보는 온라인 도구에 입력하지 마세요.

    ## 사이트의 목적

    JSON, JWT, Base64, 정규식, 날짜, SQL처럼 개발 중 자주 만나는 형식을 빠르게 확인하고 변환할 수 있도록 돕는 것이 목적입니다. 각 도구에는 사용 순서, 예시, 한계, 보안 주의 사항을 함께 정리합니다.

    ## it-box가 직접 만든 것

    - Google Timeline 시각화 도구: 내 Google Timeline JSON을 브라우저에서만 읽어 선택한 기간의 이동 경로를 미리 봅니다.
    - 30종의 추가 브라우저 전용 도구: CSV·JSON Lines 변환, 쿼리 문자열 파서, CSS 생성기, 이미지 크기 조정 등 입력을 서버로 보내지 않는 도구입니다.
    - 한국어 가이드와 도구별 사용 안내: 도구마다 결과의 의미와 한계를 설명합니다.

    ## 오픈소스 프로젝트에서 가져온 것

    나머지 도구의 기본 구조와 상당수의 기능은 오픈소스 프로젝트 it-tools에서 가져와 수정한 것입니다. 원작자의 저작권과 라이선스 고지는 아래 오픈소스 고지 섹션에 그대로 남겨 두었습니다.

    ## 브라우저 처리 원칙

    it-box는 가능한 기능을 현재 브라우저 안에서 처리하는 것을 원칙으로 합니다. 다만 브라우저 확장 기능, 네트워크, 외부 광고 서비스의 동작까지 통제할 수는 없으므로 민감한 값은 테스트용 더미 데이터로 바꿔 사용하세요.


    ## 광고 및 운영

    이 사이트는 운영비와 서비스 유지 비용을 마련하기 위해 Google AdSense 광고를 표시할 수 있습니다. 광고는 도구의 결과·변환 과정·추천 순서에 영향을 주지 않으며, 광고 클릭을 유도하거나 보상하지 않습니다. 광고가 표시되는 위치에는 사용자가 콘텐츠와 구분할 수 있도록 충분한 여백을 둡니다.

    ## 오픈소스 고지

    이 사이트는 [CorentinTh/it-tools](https://github.com/CorentinTh/it-tools)를 수정해 사용하며 GNU GPL v3로 배포됩니다. 원본의 저작권 및 라이선스 고지를 보존합니다. 수정된 소스는 [redplug/it-box](https://github.com/redplug/it-box)에서 공개합니다.
privacy:
  content: |
    # 개인정보처리방침

    **시행일: 2026년 7월 25일**

    개인정보 보호업무 담당: it-box

    문의: [redplug&#64;gmail.com](mailto:redplug%40gmail.com)

    it-box는 가능한 경우 입력한 데이터를 브라우저에서 처리합니다. 일반적인 변환·생성 기능의 입력값을 자체 서버에 저장하거나 계정과 연결하지 않도록 설계했지만, 브라우저 확장 기능·네트워크·외부 광고 서비스의 처리 방식까지 보장하지는 않습니다. 민감한 값은 테스트 전에 직접 삭제하거나 더미 값으로 바꾸세요.

    광고가 활성화되면 Google과 광고 파트너가 광고 제공, 빈도 제한, 성과 측정, 보안 및 개인 맞춤 광고를 위해 쿠키 또는 유사 기술을 사용할 수 있습니다. 지역과 동의 설정에 따라 개인 맞춤 광고가 아닌 광고가 제공될 수 있습니다. 방문자는 브라우저의 쿠키 설정, Google [광고 설정](https://adssettings.google.com/) 및 사이트에 표시되는 동의 관리 화면에서 선택을 변경할 수 있습니다.

    문의가 접수되면 답변에 필요한 범위에서 이메일 주소와 문의 내용을 사용하며, 법령상 보관이 필요한 경우를 제외하고 목적이 끝나면 삭제합니다. 개인정보 처리에 관한 문의는 위 이메일로 보내주세요.
contact:
  content: |
    # 문의하기

    문의는 아래 방법 중 편한 곳으로 보내 주세요.

    - 이메일: [redplug&#64;gmail.com](mailto:redplug%40gmail.com)
    - GitHub 이슈: https://github.com/redplug/it-box/issues

    ## 버그를 신고할 때 포함해 주세요

    - 문제가 생긴 도구의 주소 (예: /json-prettify)
    - 사용한 브라우저와 운영체제 버전
    - 재현 순서와 기대한 결과, 실제 결과
    - 입력 형식 설명. 실제 비밀번호·토큰·개인정보는 빼고 더미 데이터로 알려 주세요.

    ## 답변 시간

    보통 며칠 이내에 답변드리지만, 주말과 공휴일에는 늦어질 수 있습니다.

